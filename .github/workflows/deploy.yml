name: Deploy to EC2 (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # t4g = arm64 → ต้อง build บน runner arm ไม่งั้น native module พังตอนรันบน EC2
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Next.js (standalone)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # metadata (canonical / og:url / og:image) ถูกคำนวณตอน build → ต้องเป็นโดเมนจริง ไม่ใช่ localhost
          SITE_URL: https://bigcathouse.com
          # ห้ามตั้ง API_ORIGIN ตรงนี้ — next.config rewrites (/api → Express) ถูกฝังตอน build และต้องเป็น localhost:3001 บน EC2

      - name: Assemble release folder
        run: |
          set -e
          rm -rf release && mkdir -p release
          cp -r .next/standalone/. release/
          mkdir -p release/.next/static release/public
          cp -r .next/static/. release/.next/static/
          cp -r public/. release/public/
          cp -r server release/server
          cp package.json package-lock.json ecosystem.config.cjs release/
          # dependency ของ Express (standalone ของ Next มี node_modules ของตัวเองแล้ว)
          cd release && npm ci --omit=dev --ignore-scripts

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          rsync -az --delete \
            --exclude '.env' --exclude 'server/uploads/' --exclude 'server/private-passport/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            release/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/bigcat/

      - name: Reload app (ล้าง ISR cache ของ build เก่าก่อน — ไม่งั้น Next เสิร์ฟ HTML เก่าที่ชี้ไป chunk ที่ถูกลบแล้ว หน้าเว็บจะไม่มี CSS)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash -s <<'REMOTE'
            set -e
            cd /var/www/bigcat
            rm -rf .next/cache
            find .next/server/app -type f \( -name '*.html' -o -name '*.rsc' -o -name '*.meta' -o -name '*.body' \) -newer package.json -delete 2>/dev/null || true
            # เว็บ: สร้างโปรเซสใหม่ (ไม่ reload) ให้ in-memory cache หายแน่ ๆ · API: reload ตามเดิม
            pm2 delete bigcat-web >/dev/null 2>&1 || true
            # โปรเซสเว็บเก่าที่หลุดจาก pm2 แต่ยังจับพอร์ต 3100 อยู่ → ฆ่าทิ้งก่อน ไม่งั้นตัวใหม่ bind ไม่ได้และของเก่าเสิร์ฟ build เก่าต่อ
            (command -v fuser >/dev/null && fuser -k -TERM 3100/tcp) || pkill -TERM -f 'bigcat/server.js' || true
            sleep 2
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
          REMOTE

      - name: Data migration (idempotent — พาธภาพที่แปลงชนิดไฟล์ · ลายแสตมป์ passport)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'cd /var/www/bigcat && node server/migrate-images-15sep.js && node server/migrate-passport-16sep.js'

      - name: Health check (เว็บกับ API ต้องตอบ 200 หลัง reload ไม่งั้น deploy นี้ถือว่าล้ม)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash -s <<'REMOTE'
            set -e
            for i in $(seq 1 12); do
              W=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/ || true)
              A=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/events || true)
              echo "try $i: web=$W api=$A"
              if [ "$W" = "200" ] && [ "$A" = "200" ]; then
                # หน้า ISR ต้องอ้างไฟล์ CSS ที่มีอยู่จริงใน build นี้ (กัน HTML เก่าค้าง)
                SLUG=$(curl -s http://127.0.0.1:3001/api/events | grep -oE '"slug":"[^"]+"' | head -1 | cut -d'"' -f4)
                CSS=$(curl -s "http://127.0.0.1:3100/events/$SLUG" | grep -oE '/_next/static/[^"]+\.css' | head -1)
                C=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100$CSS" || true)
                echo "event page css=$CSS → $C"
                [ "$C" = "200" ] && exit 0
              fi
              sleep 5
            done
            echo "::error::health check failed"; pm2 logs --lines 20 --nostream; exit 1
          REMOTE
